<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Glory's Sticker Studio ⭐ — Ponies & Kid Favorites!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff69b4;
            --primary-light: #ff8ec7;
            --primary-dark: #e04895;
            --accent-blue: #87ceeb;
            --accent-gold: #ffd700;
            --accent-purple: #9b59b6;
            --accent-green: #2ecc71;
            --bg-sidebar: linear-gradient(180deg, #2d1847 0%, #170d2c 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 105, 180, 0.25);
            --sidebar-width: 440px;
            --sidebar-collapsed-width: 54px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background: #140d23;
            color: #ffffff;
            cursor: default;
        }

        /* Ambient Canvas Background */
        .canvas {
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            bottom: 0;
            overflow: hidden;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: none;
            background-color: #1a1035;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .sidebar.collapsed ~ .canvas {
            left: var(--sidebar-collapsed-width);
        }

        .canvas-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ffffff 0%, #ffc0cb 20%, #ffe4b5 35%, #fffacd 50%, #90ee90 65%, #87ceeb 80%, #dda0dd 90%, #ffffff 100%);
            background-size: 350% 350%;
            animation: gradientShift 14s ease infinite;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particle Overlay */
        #particleCanvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 3px solid var(--glass-border);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.5);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar.collapsed .sidebar-content,
        .sidebar.collapsed .logo-title,
        .sidebar.collapsed .header-actions {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar.collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 2px solid rgba(255, 105, 180, 0.2);
            min-height: 60px;
            background: rgba(45, 24, 71, 0.7);
            backdrop-filter: blur(10px);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .logo-icon {
            font-size: 1.5rem;
            animation: gentleBob 2.5s ease-in-out infinite;
        }

        @keyframes gentleBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(5deg); }
        }

        .logo-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.15rem;
            background: linear-gradient(135deg, #ff69b4, #ffd700, #87ceeb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 105, 180, 0.15);
            color: #ffb6c1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(255, 105, 180, 0.35);
            color: #ffffff;
            transform: scale(1.08);
            border-color: #ff69b4;
        }

        .toggle-icon {
            transition: transform 0.3s;
        }

        /* Sidebar Content */
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            transition: opacity 0.2s;
            scrollbar-width: thin;
            scrollbar-color: #ff69b4 #1f1136;
            padding-bottom: 24px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 4px;
        }

        .section {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-title {
            font-family: 'Fredoka One', cursive;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ff8ec7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-badge {
            background: rgba(255, 105, 180, 0.25);
            color: #ffd700;
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 800;
        }

        /* Search Input */
        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 20px;
            padding: 6px 30px 6px 12px;
            color: white;
            font-family: 'Nunito', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
            background: rgba(0, 0, 0, 0.35);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 14px;
            display: none;
        }

        .search-clear:hover {
            color: white;
        }

        /* Category Filter Pills */
        .cat-pills {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .cat-pills::-webkit-scrollbar {
            display: none;
        }

        .cat-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #d8c2e6;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-pill:hover {
            background: rgba(255, 105, 180, 0.2);
            color: white;
        }

        .cat-pill.active {
            background: linear-gradient(135deg, #ff69b4, #9b59b6);
            color: white;
            border-color: #ff69b4;
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        /* Backgrounds Grid */
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .bg-card {
            aspect-ratio: 16/10;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .bg-card:hover {
            border-color: rgba(255, 105, 180, 0.8);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
        }

        .bg-card.active {
            border-color: #ffd700;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.6);
            transform: scale(1.02);
        }

        .bg-card img, .bg-card .gradient-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bg-card .bg-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3px 2px;
            text-align: center;
            color: white;
            font-size: 0.6rem;
            font-weight: 800;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 100%);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .gradient-preview {
            background: linear-gradient(135deg, #fff 0%, #ffc0cb 20%, #ffe4b5 35%, #fffacd 50%, #90ee90 65%, #87ceeb 80%, #dda0dd 90%, #fff 100%);
            background-size: 250% 250%;
            animation: gradientShift 6s ease infinite;
        }

        /* Characters Shelf */
        .character-shelf {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-height: 440px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: #ff69b4 #1f1136;
        }

        .character-shelf::-webkit-scrollbar {
            width: 4px;
        }

        .character-shelf::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 4px;
        }

        .char-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 6px 4px 4px 4px;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }

        .char-card:hover {
            transform: scale(1.08);
            border-color: rgba(255, 105, 180, 0.5);
            background: rgba(255, 105, 180, 0.12);
        }

        .char-card:active {
            transform: scale(0.96);
        }

        .char-img-wrap {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .char-img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            transition: transform 0.2s;
        }

        .char-card:hover .char-img-wrap img {
            transform: scale(1.1) rotate(2deg);
        }

        .char-name {
            font-size: 0.6rem;
            font-weight: 700;
            color: #eeddf8;
            margin-top: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .char-emoji {
            font-size: 48px;
            line-height: 64px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .char-card:hover .char-emoji {
            transform: scale(1.15) rotate(-4deg);
            display: inline-block;
        }

        .fav-star {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.35);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 2;
        }

        .fav-star:hover {
            transform: scale(1.25);
            color: #ffd700;
            border-color: #ffd700;
        }

        .fav-star.active {
            color: #ffd700;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .surprise-btn {
            width: 100%;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff69b4, #ffd700, #87ceeb);
            border: none;
            border-radius: 14px;
            padding: 10px;
            color: #1a1035;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }

        .surprise-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 18px rgba(255, 105, 180, 0.5);
        }

        .surprise-btn:active {
            transform: scale(0.97);
        }

        .empty-shelf {
            grid-column: 1 / -1;
            text-align: center;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 18px 8px;
            line-height: 1.6;
        }

        /* Decorations Shelf */
        .decor-tools {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .bubble-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.3), rgba(135, 206, 235, 0.3));
            border: 1px dashed #ff69b4;
            border-radius: 12px;
            padding: 8px 10px;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .bubble-btn:hover {
            background: linear-gradient(135deg, #ff69b4, #87ceeb);
            color: #1a1035;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 105, 180, 0.4);
            border-style: solid;
        }

        .sticker-shelf {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .sticker-thumb {
            aspect-ratio: 1;
            border-radius: 10px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .sticker-thumb:hover {
            transform: scale(1.2) rotate(-5deg);
            border-color: rgba(255, 105, 180, 0.5);
            background: rgba(255, 105, 180, 0.12);
        }

        .sticker-thumb:active {
            transform: scale(0.95);
        }

        .sticker-thumb .emoji-sticker {
            font-size: 22px;
            line-height: 1;
        }

        /* Ambient FX Selector */
        .fx-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .fx-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 2px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }

        .fx-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .fx-btn.active {
            background: #ff69b4;
            color: white;
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(255, 105, 180, 0.4);
        }

        /* Sticker on Canvas */
        .sticker {
            position: absolute;
            cursor: grab;
            user-select: none;
            z-index: 10;
            touch-action: none;
            display: inline-block;
            transform-origin: center center;
            transition: filter 0.15s ease, outline 0.15s ease;
        }

        .sticker:hover {
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
            z-index: 80;
        }

        .sticker:active {
            cursor: grabbing;
        }

        .sticker.dragging {
            filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.6));
            transition: none;
            z-index: 500 !important;
        }

        .sticker.selected {
            outline: 2px dashed #ff69b4;
            outline-offset: 6px;
            border-radius: 4px;
        }

        /* Floating handles on selected sticker */
        .sticker-ctrl {
            display: none;
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            color: white;
            font-size: 13px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 600;
            transition: transform 0.15s;
        }

        .sticker.selected .sticker-ctrl {
            display: flex;
        }

        .sticker-ctrl:hover {
            transform: scale(1.2);
        }

        .sticker-ctrl.del {
            top: -16px;
            right: -16px;
            background: #ff4757;
        }

        .sticker-ctrl.flip {
            top: -16px;
            left: -16px;
            background: #9b59b6;
        }

        .sticker-ctrl.rotate {
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            background: #3498db;
        }

        .sticker-ctrl.rotate:hover {
            transform: translateX(-50%) scale(1.2);
        }

        .sticker-ctrl.dup {
            bottom: -16px;
            left: -16px;
            background: #2ecc71;
        }

        .sticker-ctrl.resize {
            bottom: -16px;
            right: -16px;
            background: #e67e22;
            cursor: nwse-resize;
        }

        .sticker-content {
            display: block;
            pointer-events: none;
            transform-origin: center center;
        }

        .sticker img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Speech Bubble Sticker */
        .speech-bubble {
            background: #ffffff;
            color: #2d1847;
            padding: 10px 16px;
            border-radius: 18px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            border: 3px solid #ff69b4;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 90px;
            max-width: 280px;
            text-align: center;
            position: relative;
            outline: none;
            word-wrap: break-word;
            line-height: 1.25;
            cursor: text;
        }

        .speech-bubble-tail {
            position: absolute;
            bottom: -14px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #ff69b4;
            pointer-events: none;
        }

        .speech-bubble-tail::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid #ffffff;
        }

        /* Sparkle Burst FX Particles */
        .burst-particle {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            z-index: 9999;
            animation: burstAnim 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes burstAnim {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0) rotate(var(--rot));
                opacity: 0;
            }
        }

        /* Bottom Floating Toolbar */
        .toolbar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(calc(-50% + (var(--sidebar-width) / 2)));
            z-index: 100;
            background: rgba(45, 24, 71, 0.85);
            padding: 8px 18px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.collapsed ~ .toolbar {
            transform: translateX(calc(-50% + (var(--sidebar-collapsed-width) / 2)));
        }

        .toolbar-btn {
            height: 38px;
            padding: 0 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            white-space: nowrap;
        }

        .toolbar-btn.icon-only {
            width: 38px;
            padding: 0;
            border-radius: 50%;
        }

        .toolbar-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.08);
        }

        .toolbar-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .toolbar-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .toolbar-btn.save {
            background: linear-gradient(135deg, #ff69b4, #ffd700);
            color: #170d2c;
            border: none;
            font-family: 'Fredoka One', cursive;
            padding: 0 16px;
            font-size: 13px;
        }

        .toolbar-btn.save:hover {
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
        }

        .toolbar-btn.primary {
            background: rgba(255, 105, 180, 0.25);
            color: #ffb6c1;
        }

        .toolbar-btn.primary:hover:not(:disabled) {
            background: #ff69b4;

        /* ==========================================================
           2. SOUND SYNTHESIS ENGINE (Web Audio API)
           ========================================================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = localStorage.getItem('glory_sound_enabled') !== 'false';
                this.updateButton();
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            toggle() {
                this.enabled = !this.enabled;
                localStorage.setItem('glory_sound_enabled', this.enabled ? 'true' : 'false');
                this.updateButton();
                if (this.enabled) {
                    this.play('sparkle');
                    showToast('🔊 Sound turned ON', '🎵');
                } else {
                    showToast('🔇 Sound turned OFF', '🔇');
                }
            }
            updateButton() {
                const btn = document.getElementById('soundToggle');
                if (btn) btn.textContent = this.enabled ? '🔊' : '🔇';
            }
            play(type) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    if (type === 'pop') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(380, now);
                        osc.frequency.exponentialRampToValueAtTime(840, now + 0.08);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.09);
                    } else if (type === 'sparkle') {
                        [1046.5, 1318.5, 1567.98, 2093.0].forEach((freq, idx) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            const t = now + idx * 0.05;
                            osc.frequency.setValueAtTime(freq, t);
                            gain.gain.setValueAtTime(0.18, t);
                            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(t);
                            osc.stop(t + 0.17);
                        });
                    } else if (type === 'boing') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(320, now);
                        osc.frequency.exponentialRampToValueAtTime(650, now + 0.11);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.22);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.23);
                    } else if (type === 'whoosh') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(90, now + 0.14);
                        gain.gain.setValueAtTime(0.14, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.15);
                    } else if (type === 'camera') {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(1200, now);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.06);
                    }
                } catch (e) {
                    console.warn('Audio playback error', e);
                }
            }
        }

        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        let currentFx = 'sparkles';
        const fxSymbols = {
            sparkles: ['✨', '⭐', '💫', '🌸'],
            butterflies: ['🦋', '🌸', '✨'],
            hearts: ['💖', '💕', '💗', '❤️', '💜'],
            stars: ['⭐', '🌟', '✨', '💫'],
            none: []

        function resizeParticleCanvas() {
            const canvasEl = document.getElementById('canvas');
            const rect = canvasEl.getBoundingClientRect();
            pCanvas.width = rect.width;
            pCanvas.height = rect.height;
        }
        window.addEventListener('resize', resizeParticleCanvas);
        resizeParticleCanvas();

        function createParticle() {
            const symbols = fxSymbols[currentFx];
            if (!symbols || symbols.length === 0) return null;
            return {
                char: symbols[Math.floor(Math.random() * symbols.length)],
                x: Math.random() * pCanvas.width,
                y: pCanvas.height + 20,
                vx: (Math.random() - 0.5) * 1.2,
                vy: -(1 + Math.random() * 1.5),
                size: 14 + Math.random() * 18,
                alpha: 0.1 + Math.random() * 0.7,
                rot: Math.random() * Math.PI * 2,
                vrot: (Math.random() - 0.5) * 0.04,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.03 + Math.random() * 0.03
            };
        }

        function initParticles() {
            particles = [];
            if (currentFx === 'none') return;
            const count = Math.min(25, Math.floor(pCanvas.width / 45));
            for (let i = 0; i < count; i++) {
                const p = createParticle();
                if (p) {
                    p.y = Math.random() * pCanvas.height;
                    particles.push(p);
                }
            }
        }
        initParticles();

        function renderParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            if (currentFx !== 'none') {
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.wobble += p.wobbleSpeed;
                    p.x += p.vx + Math.sin(p.wobble) * 0.8;
                    p.y += p.vy;
                    p.rot += p.vrot;

                    pCtx.save();
                    pCtx.globalAlpha = p.alpha;
                    pCtx.translate(p.x, p.y);
                    pCtx.rotate(p.rot);
                    pCtx.font = `${p.size}px sans-serif`;
                    pCtx.textAlign = 'center';
                    pCtx.textBaseline = 'middle';
                    pCtx.fillText(p.char, 0, 0);
                    pCtx.restore();

                    if (p.y < -30 || p.x < -30 || p.x > pCanvas.width + 30) {
                        particles[i] = createParticle() || p;
                    }
                }
            }
            requestAnimationFrame(renderParticles);
        }
        requestAnimationFrame(renderParticles);

        /* Sparkle burst at specific coordinates */
        function triggerSparkleBurst(x, y) {
            const symbols = ['✨', '⭐', '💖', '🌟', '🌸', '💫'];
            const count = 12;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
                const dist = 50 + Math.random() * 80;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                const rot = (Math.random() - 0.5) * 360;

                const p = document.createElement('div');
                p.className = 'burst-particle';
                p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);
                p.style.setProperty('--rot', `${rot}deg`);
                document.body.appendChild(p);

                setTimeout(() => p.remove(), 750);

        }

        function renderCharacters(filterCategory = 'all', filterSearch = '') {

        (function upgradeFileArt() {
            const candidates = CHARACTERS.filter(c => !c.src && c.emoji);
            if (!candidates.length) return;
            let pending = candidates.length;
            let upgraded = false;
            const settled = () => {

                test.onload = () => {
                    char.src = `stickers/${char.id}.png`;

                    settled();

        /* ==========================================================
           5. STICKER MANAGEMENT & MANIPULATION
           ========================================================== */
        let selectedSticker = null;
        let highestZ = 20;

        function addSticker(options) {
            const el = document.createElement('div');
            el.className = 'sticker';

            // Attributes
            let rotation = options.rotation || 0;
            let flipX = options.flipX !== undefined ? options.flipX : 1;
            let zIndex = options.zIndex || ++highestZ;

            el.dataset.rotation = rotation;
            el.dataset.flipX = flipX;
            el.style.zIndex = zIndex;

            // Content
            if (options.src) {
                el.dataset.type = 'image';
                el.dataset.src = options.src;
                el.dataset.name = options.name || 'Pony';
                if (options.fallback) el.dataset.fallback = options.fallback;
                const width = options.width || 200;
                el.dataset.width = width;
                el.style.width = width + 'px';

                el.innerHTML = `
                    <div class="sticker-content">
                        <img src="${options.src}" alt="${options.name || 'sticker'}" draggable="false">
                    </div>
                `;

                // If the art file is missing, swap to the emoji fallback (no broken image)
                const imgEl = el.querySelector('img');
                if (imgEl && options.fallback) {
                    imgEl.addEventListener('error', () => {
                        el.dataset.type = 'emoji';
                        el.dataset.emoji = options.fallback;
                        el.dataset.size = 96;
                        delete el.dataset.src;
                        const content = el.querySelector('.sticker-content');
                        if (content) {
                            content.classList.add('emoji-content');
                            content.style.cssText = 'font-size:96px;line-height:1;text-align:center;';
                            content.textContent = options.fallback;
                        }
                    });
                }
            } else if (options.emoji) {
                el.dataset.type = 'emoji';
                el.dataset.emoji = options.emoji;
                const size = options.size || 72;
                el.dataset.size = size;

                el.innerHTML = `
                    <div class="sticker-content emoji-content" style="font-size: ${size}px; line-height: 1; text-align: center;">
                        ${options.emoji}
                    </div>
                `;
            } else if (options.isSpeech) {
                el.dataset.type = 'speech';
                el.innerHTML = `
                    <div class="speech-bubble" contenteditable="true" spellcheck="false">
                        ${options.text || 'Hello! ✨'}
                        <div class="speech-bubble-tail"></div>
                    </div>
                `;
            }

            // Controls on selected sticker
            const delBtn = document.createElement('button');
            delBtn.className = 'sticker-ctrl del';
            delBtn.innerHTML = '✕';
            delBtn.title = 'Delete';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSticker(el);
            });
            el.appendChild(delBtn);

            const flipBtn = document.createElement('button');
            flipBtn.className = 'sticker-ctrl flip';
            flipBtn.innerHTML = '↔';
            flipBtn.title = 'Flip Horizontal';
            flipBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFlip(el);
            });
            el.appendChild(flipBtn);

            const rotBtn = document.createElement('button');
            rotBtn.className = 'sticker-ctrl rotate';
            rotBtn.innerHTML = '🔄';
            rotBtn.title = 'Rotate 45°';
            rotBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                rotateSticker(el, 45);
            });
            el.appendChild(rotBtn);

            const dupBtn = document.createElement('button');
            dupBtn.className = 'sticker-ctrl dup';
            dupBtn.innerHTML = '⧉';
            dupBtn.title = 'Duplicate';
            dupBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                duplicateSticker(el);
            });
            el.appendChild(dupBtn);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'sticker-ctrl resize';
            resizeHandle.innerHTML = '⤡';
            resizeHandle.title = 'Drag to Resize';
            el.appendChild(resizeHandle);

            // Positioning
            const canvasRect = canvas.getBoundingClientRect();
            const posX = options.x !== undefined ? options.x : (Math.random() * (canvasRect.width - 200) + 20);
            const posY = options.y !== undefined ? options.y : (Math.random() * (canvasRect.height - 200) + 20);
            el.style.left = `${posX}px`;
            el.style.top = `${posY}px`;

            updateStickerTransform(el);

            // Double Click Fun
            el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                sfx.play('boing');
                const r = el.getBoundingClientRect();
                triggerSparkleBurst(r.left + r.width / 2, r.top + r.height / 2);
                el.animate([
                    { transform: `${el.style.transform} scale(1)` },
                    { transform: `${el.style.transform} scale(1.15) rotate(-4deg)` },
                    { transform: `${el.style.transform} scale(1)` }
                ], { duration: 350, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
            });

            // Pointer Drag Logic
            let isDragging = false;
            let isResizing = false;
            let startPointerX, startPointerY;
            let startLeft, startTop;
            let startWidth, startSize;

            el.addEventListener('pointerdown', (e) => {
                if (e.target.classList.contains('sticker-ctrl')) {
                    if (e.target.classList.contains('resize')) {
                        isResizing = true;
                        startPointerX = e.clientX;
                        startPointerY = e.clientY;
                        startWidth = el.offsetWidth;
                        const emojiEl = el.querySelector('.emoji-content');
                        if (emojiEl) startSize = parseFloat(el.dataset.size || 72);
                        el.setPointerCapture(e.pointerId);
                        selectSticker(el);
                        e.stopPropagation();
                        e.preventDefault();
                    }
                    return;
                }

                if (e.target.classList.contains('speech-bubble') && e.target === document.activeElement) {
                    selectSticker(el);
                    return;
                }

                isDragging = true;
                startPointerX = e.clientX;
                startPointerY = e.clientY;
                startLeft = parseFloat(el.style.left);
                startTop = parseFloat(el.style.top);
                el.classList.add('dragging');
                el.setPointerCapture(e.pointerId);
                selectSticker(el);
                e.stopPropagation();
                e.preventDefault();
            });

            el.addEventListener('pointermove', (e) => {
                if (isDragging) {
                    const dx = e.clientX - startPointerX;
                    const dy = e.clientY - startPointerY;
                    el.style.left = `${startLeft + dx}px`;
                    el.style.top = `${startTop + dy}px`;
                } else if (isResizing) {
                    const dx = e.clientX - startPointerX;
                    if (el.dataset.type === 'image') {
                        const newWidth = Math.max(50, Math.min(650, startWidth + dx));
                        el.style.width = `${newWidth}px`;
                        el.dataset.width = newWidth;
                    } else if (el.dataset.type === 'emoji') {
                        const emojiEl = el.querySelector('.emoji-content');
                        const newSize = Math.max(24, Math.min(220, startSize + dx * 0.5));
                        emojiEl.style.fontSize = `${newSize}px`;
                        el.dataset.size = newSize;
                    }
                }
            });

            const onPointerEnd = (e) => {
                if (isDragging || isResizing) {
                    el.classList.remove('dragging');
                    isDragging = false;
                    isResizing = false;
                    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
                    pushHistory();
                }
            };
            el.addEventListener('pointerup', onPointerEnd);
            el.addEventListener('pointercancel', onPointerEnd);

            // Selection
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                selectSticker(el);
            });

            canvas.appendChild(el);
            selectSticker(el);
            updateStickerCount();
            return el;
        }

        function selectSticker(el) {
            if (selectedSticker === el) return;
            if (selectedSticker) selectedSticker.classList.remove('selected');
            selectedSticker = el;
            if (selectedSticker) {
                selectedSticker.classList.add('selected');
                updateToolbarButtons();
            }
        }

        function deselectAll() {
            if (selectedSticker) {
                selectedSticker.classList.remove('selected');
                selectedSticker = null;
                updateToolbarButtons();
            }
        }

        canvas.addEventListener('click', (e) => {
            if (e.target === canvas || e.target === canvasGradient || e.target === pCanvas) {
                deselectAll();
            }
        });

        function updateStickerTransform(el) {
            const rot = el.dataset.rotation || 0;
            const flip = el.dataset.flipX || 1;
            el.style.transform = `rotate(${rot}deg) scaleX(${flip})`;
        }

        function toggleFlip(el) {
            if (!el) return;
            const currentFlip = parseFloat(el.dataset.flipX || 1);
            el.dataset.flipX = currentFlip === 1 ? -1 : 1;
            updateStickerTransform(el);
            sfx.play('boing');
            pushHistory();
        }

        function rotateSticker(el, degDelta) {
            if (!el) return;
            let currentRot = parseFloat(el.dataset.rotation || 0);
            currentRot = (currentRot + degDelta) % 360;
            el.dataset.rotation = currentRot;
            updateStickerTransform(el);
            sfx.play('pop');
            pushHistory();
        }

        function resizeSticker(el, delta) {
            if (!el) return;
            if (el.dataset.type === 'image') {
                const currentW = parseFloat(el.dataset.width || el.offsetWidth);
                const newW = Math.max(50, Math.min(650, currentW + delta));
                el.style.width = `${newW}px`;
                el.dataset.width = newW;
            } else if (el.dataset.type === 'emoji') {
                const emojiEl = el.querySelector('.emoji-content');
                const currentS = parseFloat(el.dataset.size || 72);
                const newS = Math.max(24, Math.min(240, currentS + delta * 0.4));
                emojiEl.style.fontSize = `${newS}px`;
                el.dataset.size = newS;
            } else if (el.dataset.type === 'speech') {
                const bubble = el.querySelector('.speech-bubble');
                const currentF = parseFloat(window.getComputedStyle(bubble).fontSize);
                bubble.style.fontSize = `${Math.max(12, Math.min(32, currentF + (delta > 0 ? 2 : -2)))}px`;
            }
            sfx.play('pop');
            pushHistory();
        }

        function deleteSticker(el) {
            if (!el) return;
            const rect = el.getBoundingClientRect();
            triggerSparkleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2);
            el.remove();
            if (selectedSticker === el) {
                selectedSticker = null;
                updateToolbarButtons();
            }
            sfx.play('whoosh');
            updateStickerCount();
            pushHistory();
        }

        function duplicateSticker(el) {
            if (!el) return;
            const left = parseFloat(el.style.left) + 35;
            const top = parseFloat(el.style.top) + 35;
            let newSticker;

            if (el.dataset.type === 'image') {
                newSticker = addSticker({
                    src: el.dataset.src,
                    name: el.dataset.name,
                    fallback: el.dataset.fallback,
                    width: parseFloat(el.dataset.width || el.offsetWidth),
                    rotation: parseFloat(el.dataset.rotation || 0),
                    flipX: parseFloat(el.dataset.flipX || 1),
                    x: left,
                    y: top
                });
            } else if (el.dataset.type === 'emoji') {
                newSticker = addSticker({
                    emoji: el.dataset.emoji,
                    size: parseFloat(el.dataset.size || 72),
                    rotation: parseFloat(el.dataset.rotation || 0),
                    flipX: parseFloat(el.dataset.flipX || 1),
                    x: left,
                    y: top
                });
            } else if (el.dataset.type === 'speech') {
                const text = el.querySelector('.speech-bubble').innerText;
                newSticker = addSticker({
                    isSpeech: true,
                    text: text,
                    rotation: parseFloat(el.dataset.rotation || 0),
                    flipX: parseFloat(el.dataset.flipX || 1),
                    x: left,
                    y: top
                });
            }
            sfx.play('boing');
            pushHistory();
        }

        function changeLayer(el, direction) {
            if (!el) return;
            if (direction === 'up') {
                el.style.zIndex = ++highestZ;
            } else {
                const stickers = Array.from(canvas.querySelectorAll('.sticker'));
                let lowestZ = 100;
                stickers.forEach(s => {
                    const z = parseInt(s.style.zIndex) || 10;
                    if (z < lowestZ) lowestZ = z;
                });
                el.style.zIndex = Math.max(1, lowestZ - 1);
            }
            sfx.play('pop');
            pushHistory();
        }

        function updateStickerCount() {
            const count = canvas.querySelectorAll('.sticker').length;
            document.getElementById('stickerCount').textContent = `${count} ${count === 1 ? 'item' : 'items'}`;
        }

        function updateToolbarButtons() {
            const hasSel = selectedSticker !== null;
            document.getElementById('flipBtn').disabled = !hasSel;
            document.getElementById('rotateBtn').disabled = !hasSel;
            document.getElementById('sizeDown').disabled = !hasSel;
            document.getElementById('sizeUp').disabled = !hasSel;
            document.getElementById('layerUpBtn').disabled = !hasSel;
            document.getElementById('layerDownBtn').disabled = !hasSel;
            document.getElementById('duplicateBtn').disabled = !hasSel;
        }

        /* Mouse Wheel to resize selected sticker */
        canvas.addEventListener('wheel', (e) => {
            if (selectedSticker && selectedSticker.contains(e.target)) {
                e.preventDefault();
                resizeSticker(selectedSticker, e.deltaY < 0 ? 15 : -15);
            }
        }, { passive: false });

        /* ==========================================================
           6. TOOLBAR ACTIONS
           ========================================================== */
        document.getElementById('flipBtn').addEventListener('click', () => toggleFlip(selectedSticker));
        document.getElementById('rotateBtn').addEventListener('click', () => rotateSticker(selectedSticker, 45));
        document.getElementById('sizeDown').addEventListener('click', () => resizeSticker(selectedSticker, -30));
        document.getElementById('sizeUp').addEventListener('click', () => resizeSticker(selectedSticker, 30));
        document.getElementById('layerUpBtn').addEventListener('click', () => changeLayer(selectedSticker, 'up'));
        document.getElementById('layerDownBtn').addEventListener('click', () => changeLayer(selectedSticker, 'down'));
        document.getElementById('duplicateBtn').addEventListener('click', () => duplicateSticker(selectedSticker));

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            const stickers = canvas.querySelectorAll('.sticker');
            if (stickers.length === 0) return;
            if (confirm('Clear all stickers from your scene? ✨')) {
                stickers.forEach(s => s.remove());
                selectedSticker = null;
                updateToolbarButtons();
                updateStickerCount();
                sfx.play('whoosh');
                showToast('Canvas Cleared! ✨', '🗑️');
                pushHistory();
            }
        });

        /* ==========================================================
           7. UNDO / REDO & LOCALSTORAGE PERSISTENCE
           ========================================================== */
        const history = [];
        let historyIndex = -1;
        let isRestoringHistory = false;

        function serializeScene() {
            const stickersData = [];
            canvas.querySelectorAll('.sticker').forEach(el => {
                stickersData.push({
                    type: el.dataset.type,
                    src: el.dataset.src,
                    name: el.dataset.name,
                    emoji: el.dataset.emoji,
                    fallback: el.dataset.fallback,
                    width: el.dataset.width,
                    size: el.dataset.size,
                    rotation: el.dataset.rotation,
                    flipX: el.dataset.flipX,
                    zIndex: el.style.zIndex,
                    left: el.style.left,
                    top: el.style.top,
                    text: el.dataset.type === 'speech' ? el.querySelector('.speech-bubble').innerText.trim() : null
                });
            });
            return {
                bg: currentBg,
                fx: currentFx,
                stickers: stickersData
            };
        }

        function restoreScene(state) {
            isRestoringHistory = true;
            canvas.querySelectorAll('.sticker').forEach(s => s.remove());
            selectedSticker = null;

            selectBackground(state.bg, false);

            if (state.fx && state.fx !== currentFx) {
                currentFx = state.fx;
                document.querySelectorAll('.fx-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.fx === state.fx);
                });
                initParticles();
            }

            state.stickers.forEach(data => {
                addSticker({
                    src: data.src,
                    name: data.name,
                    emoji: data.emoji,
                    fallback: data.fallback,
                    width: data.width ? parseFloat(data.width) : undefined,
                    size: data.size ? parseFloat(data.size) : undefined,
                    rotation: data.rotation ? parseFloat(data.rotation) : 0,
                    flipX: data.flipX ? parseFloat(data.flipX) : 1,
                    zIndex: data.zIndex ? parseInt(data.zIndex) : undefined,
                    x: parseFloat(data.left),
                    y: parseFloat(data.top),
                    isSpeech: data.type === 'speech',
                    text: data.text
                });
            });

            deselectAll();
            updateStickerCount();
            isRestoringHistory = false;
        }

        function pushHistory() {
            if (isRestoringHistory) return;
            const state = serializeScene();
            // Drop redo future if branching
            if (historyIndex < history.length - 1) {
                history.splice(historyIndex + 1);
            }
            history.push(JSON.stringify(state));
            if (history.length > 25) history.shift();
            historyIndex = history.length - 1;

            updateUndoRedoButtons();
            saveToLocalStorage();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreScene(JSON.parse(history[historyIndex]));
                updateUndoRedoButtons();
                saveToLocalStorage();
                sfx.play('whoosh');
                showToast('Undone ↺', '↺');
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreScene(JSON.parse(history[historyIndex]));
                updateUndoRedoButtons();
                saveToLocalStorage();
                sfx.play('pop');
                showToast('Redone ↻', '↻');
            }
        }

        function updateUndoRedoButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);

        function saveToLocalStorage() {
            try {
                localStorage.setItem('glory_scene_state', JSON.stringify(serializeScene()));
            } catch (err) {}
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('glory_scene_state');
                if (saved) {
                    const state = JSON.parse(saved);
                    restoreScene(state);
                    pushHistory();
                    return true;
                }
            } catch (err) {}
            return false;
        }

        /* ==========================================================
           8. KEYBOARD SHORTCUTS
           ========================================================== */
        window.addEventListener('keydown', (e) => {
            // If typing inside speech bubble or search input, let it through
            if (e.target.tagName === 'INPUT' || e.target.isContentEditable) {
                return;
            }

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                if (e.shiftKey) redo();
                else undo();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                redo();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
                e.preventDefault();
                if (selectedSticker) duplicateSticker(selectedSticker);
                return;
            }

            if (!selectedSticker) return;

            if (e.key === 'Delete' || e.key === 'Backspace') {
                e.preventDefault();
                deleteSticker(selectedSticker);
            } else if (e.key.toLowerCase() === 'f') {
                toggleFlip(selectedSticker);
            } else if (e.key === '[' || e.key.toLowerCase() === 'r') {
                rotateSticker(selectedSticker, -15);
            } else if (e.key === ']') {
                rotateSticker(selectedSticker, 15);
            } else if (e.key === '+' || e.key === '=') {
                resizeSticker(selectedSticker, 20);
            } else if (e.key === '-' || e.key === '_') {
                resizeSticker(selectedSticker, -20);
            } else if (e.key === 'PageUp') {
                changeLayer(selectedSticker, 'up');
            } else if (e.key === 'PageDown') {
                changeLayer(selectedSticker, 'down');
            } else if (e.key === 'Escape') {
                deselectAll();
            } else if (e.key.startsWith('Arrow')) {
                const step = e.shiftKey ? 12 : 3;
                let curLeft = parseFloat(selectedSticker.style.left);
                let curTop = parseFloat(selectedSticker.style.top);
                if (e.key === 'ArrowLeft') curLeft -= step;
                if (e.key === 'ArrowRight') curLeft += step;
                if (e.key === 'ArrowUp') curTop -= step;
                if (e.key === 'ArrowDown') curTop += step;
                selectedSticker.style.left = `${curLeft}px`;
                selectedSticker.style.top = `${curTop}px`;
                e.preventDefault();
            }
        });

        /* ==========================================================
           9. HIGH-RESOLUTION PNG EXPORT
           ========================================================== */
        document.getElementById('saveImageBtn').addEventListener('click', exportScene);

        async function exportScene() {
            showToast('Creating high-resolution picture... ✨', '🎨');
            sfx.play('camera');

            const exportCanvas = document.createElement('canvas');
            const dpr = Math.min(window.devicePixelRatio || 2, 2);
            const rect = canvas.getBoundingClientRect();
            exportCanvas.width = rect.width * dpr;
            exportCanvas.height = rect.height * dpr;
            const ctx = exportCanvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // 1. Draw Background
            if (currentBg === 'gradient') {
                const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.2, '#ffc0cb');
                grad.addColorStop(0.35, '#ffe4b5');
                grad.addColorStop(0.5, '#fffacd');
                grad.addColorStop(0.65, '#90ee90');
                grad.addColorStop(0.8, '#87ceeb');
                grad.addColorStop(0.9, '#dda0dd');
                grad.addColorStop(1, '#ffffff');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, rect.width, rect.height);
            } else {
                const bgObj = BACKGROUNDS.find(b => b.id === currentBg);
                if (bgObj) {
                    const bgImg = new Image();
                    bgImg.src = bgObj.file;
                    await new Promise((res) => {
                        if (bgImg.complete) res();
                        else { bgImg.onload = res; bgImg.onerror = res; }
                    });
                    const bgRatio = bgImg.naturalWidth / bgImg.naturalHeight;
                    const canvasRatio = rect.width / rect.height;
                    let dw, dh, dx, dy;
                    if (canvasRatio > bgRatio) {
                        dw = rect.width;
                        dh = rect.width / bgRatio;
                        dx = 0;
                        dy = (rect.height - dh) / 2;
                    } else {
                        dh = rect.height;
                        dw = rect.height * bgRatio;
                        dx = (rect.width - dw) / 2;
                        dy = 0;
                    }
                    ctx.drawImage(bgImg, dx, dy, dw, dh);
                }
            }

            // 2. Draw Ambient Particles
            if (currentFx !== 'none') {
                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.font = `${p.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.char, 0, 0);
                    ctx.restore();
                });
            }

            // 3. Draw Stickers in Layer Order
            const stickers = Array.from(canvas.querySelectorAll('.sticker'));
            stickers.sort((a, b) => (parseInt(a.style.zIndex) || 10) - (parseInt(b.style.zIndex) || 10));

            for (const el of stickers) {
                const elRect = el.getBoundingClientRect();
                const x = elRect.left - rect.left;
                const y = elRect.top - rect.top;
                const w = elRect.width;
                const h = elRect.height;
                const cx = x + w / 2;
                const cy = y + h / 2;

                const rot = (parseFloat(el.dataset.rotation) || 0) * Math.PI / 180;
                const flipX = parseFloat(el.dataset.flipX) || 1;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rot);
                ctx.scale(flipX, 1);

                if (el.dataset.type === 'image') {
                    const img = el.querySelector('img');
                    if (img && img.complete) {
                        ctx.drawImage(img, -w / 2, -h / 2, w, h);
                    }
                } else if (el.dataset.type === 'emoji') {
                    const emojiEl = el.querySelector('.emoji-content');
                    const size = parseFloat(el.dataset.size || 72);
                    ctx.font = `${size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(emojiEl.innerText.trim(), 0, 0);
                } else if (el.dataset.type === 'speech') {
                    const bubble = el.querySelector('.speech-bubble');
                    const text = bubble.innerText.trim();
                    const bw = w - 6;
                    const bh = h - 16;
                    const bx = -bw / 2;
                    const by = -bh / 2 - 8;

                    // Bubble body
                    ctx.fillStyle = '#ffffff';
                    ctx.strokeStyle = '#ff69b4';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 14);
                    else ctx.rect(bx, by, bw, bh);
                    ctx.fill();
                    ctx.stroke();

                    // Bubble tail
                    ctx.beginPath();
                    ctx.moveTo(bx + 18, by + bh);
                    ctx.lineTo(bx + 8, by + bh + 14);
                    ctx.lineTo(bx + 32, by + bh);
                    ctx.closePath();
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.stroke();

                    // Text
                    ctx.fillStyle = '#2d1847';
                    ctx.font = 'bold 15px Nunito, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, 0, by + bh / 2);
                }

                ctx.restore();
            }

            // 4. Watermark Brand
            ctx.save();
            ctx.font = "bold 15px 'Fredoka One', cursive";
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
            ctx.shadowBlur = 6;
            ctx.fillText("Glory's Sticker Studio ⭐", 24, rect.height - 24);
            ctx.restore();

            // 5. Trigger File Download
            exportCanvas.toBlob((blob) => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `glorys-sticker-creation-${Date.now()}.png`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('📸 Picture saved! Check your Downloads folder!', '💖');
            }, 'image/png');
        }

        /* Toast helper */
        let toastTimeout = null;
        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').textContent = icon;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /* ==========================================================
           10. INITIALIZATION
           ========================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            updateToolbarButtons();
            const restored = loadFromLocalStorage();
            if (!restored) {
                // Adorable Starter Scene for Glory!
                setTimeout(() => {
                    const rect = canvas.getBoundingClientRect();
                    const cy = Math.max(80, rect.height / 2 - 120);

                    // Fluttershy
                    addSticker({
                        src: 'fluttershy-smirk.png',
                        name: 'Fluttershy',
                        x: Math.max(40, rect.width * 0.15),
                        y: cy,
                        width: 220
                    });

                    // Twilight Sparkle
                    addSticker({
                        src: 'twilight.png',
                        name: 'Twilight Sparkle',
                        x: Math.max(180, rect.width * 0.45),
                        y: cy - 10,
                        width: 230
                    });

                    // Spike
                    addSticker({
                        src: 'spike.png',
                        name: 'Spike',
                        x: Math.max(120, rect.width * 0.35),
                        y: cy + 70,
                        width: 140
                    });

                    // Speech Bubble
                    addSticker({
                        isSpeech: true,
                        text: "Welcome to our studio, Glory! ✨💖",
                        x: Math.max(60, rect.width * 0.22),
                        y: Math.max(20, cy - 70)
                    });

                    // Little Butterflies
                    addSticker({
                        emoji: '🦋',
                        size: 64,
                        x: Math.max(20, rect.width * 0.10),
                        y: Math.max(20, cy - 50)
                    });

                    addSticker({
                        emoji: '✨',
                        size: 54,
                        x: Math.max(240, rect.width * 0.65),
                        y: cy + 40
                    });

                    deselectAll();
                    pushHistory();
                }, 150);
            }
        });
    </script>
